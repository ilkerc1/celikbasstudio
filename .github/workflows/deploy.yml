name: Deploy to celikbasstudio.com via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Upload Website to FTP Server
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check FTP Secrets Configuration
        id: check_secrets
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice title=FTP Bilgileri Bekleniyor::Otomatik FTP yuklemesi icin GitHub repo Settings > Secrets and variables > Actions bolumune FTP_SERVER, FTP_USERNAME ve FTP_PASSWORD ekleyin."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy files via FTP
        if: steps.check_secrets.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
